<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shayari Premium Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  min-height:100vh;
  background: linear-gradient(-45deg,#ff4e8a,#ff9966,#ff2e63,#ff4e8a);
  background-size:400% 400%;
  animation: gradient 8s ease infinite;
  display:flex;
  justify-content:center;
  padding:20px;
}

@keyframes gradient{
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}

.container{
  width:100%;
  max-width:500px;
}

h1{
  text-align:center;
  color:white;
  margin-bottom:15px;
}

input, textarea{
  width:100%;
  padding:10px;
  border-radius:20px;
  border:none;
  margin-bottom:10px;
}

button{
  padding:8px 15px;
  border:none;
  border-radius:20px;
  margin:5px 5px 0 0;
  cursor:pointer;
  background:linear-gradient(45deg,#ff2e63,#ff4e8a);
  color:white;
}

.glass{
  backdrop-filter: blur(15px);
  background: rgba(255,255,255,0.15);
  border-radius:20px;
  padding:15px;
  margin-bottom:15px;
  color:white;
  box-shadow:0 8px 32px rgba(0,0,0,0.2);
}

.footer{
  text-align:center;
  color:white;
  margin-top:15px;
  font-size:14px;
}

a{
  color:white;
  text-decoration:underline;
  cursor:pointer;
}

/* Privacy Modal */
.modal{
  display:none;
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:rgba(0,0,0,0.6);
  justify-content:center;
  align-items:center;
}

.modal-content{
  background:white;
  color:black;
  padding:20px;
  border-radius:15px;
  width:90%;
  max-width:400px;
}
</style>
</head>

<body>
<div class="container">

<h1>✨ Shayari Premium Pro ✨</h1>

<input type="text" id="search" placeholder="Search Shayari...">

<div id="shayariList"></div>

<div class="glass">
<h3>Add Your Shayari</h3>
<textarea id="newShayari" rows="3" placeholder="Write your shayari..."></textarea>
<button onclick="addShayari()">➕ Add Shayari</button>
</div>

<div class="footer">
<a onclick="openPolicy()">Privacy Policy</a><br>
Made with ❤️ by You
</div>

</div>

<!-- Privacy Policy Modal -->
<div class="modal" id="policyModal">
  <div class="modal-content">
    <h3>Privacy Policy</h3>
    <p>
      This app does not collect, store, or share any personal data.
      All added shayari are saved only on your device using local storage.
      No data is sent to any server.
    </p>
    <button onclick="closePolicy()">Close</button>
  </div>
</div>

<script>

let shayaris = JSON.parse(localStorage.getItem("shayaris")) || [
"Tere bina jeena mushkil hai ❤️",
"Mohabbat ki duniya haseen hoti hai 💕",
"Dil se yaad karte hain 💖"
];

function displayShayari(list = shayaris){
  const container = document.getElementById("shayariList");
  container.innerHTML="";
  list.forEach((text,index)=>{
    let div = document.createElement("div");
    div.className="glass";
    div.innerHTML=`
      <p>${text}</p>
      <button onclick="copyText('${text}')">Copy</button>
      <button onclick="shareText('${text}')">Share</button>
      <button onclick="whatsappShare('${text}')">WhatsApp</button>
    `;
    container.appendChild(div);
  });
}

function copyText(text){
  navigator.clipboard.writeText(text);
  alert("Copied!");
}

function shareText(text){
  if(navigator.share){
    navigator.share({
      title:"Shayari",
      text:text
    });
  } else {
    copyText(text);
  }
}

function whatsappShare(text){
  let url = "https://wa.me/?text=" + encodeURIComponent(text);
  window.open(url, "_blank");
}

function addShayari(){
  let value = document.getElementById("newShayari").value;
  if(value.trim() !== ""){
    shayaris.push(value);
    localStorage.setItem("shayaris",JSON.stringify(shayaris));
    displayShayari();
    document.getElementById("newShayari").value="";
  }
}

document.getElementById("search").addEventListener("input",function(){
  let value=this.value.toLowerCase();
  let filtered=shayaris.filter(s=>s.toLowerCase().includes(value));
  displayShayari(filtered);
});

/* Privacy Policy */
function openPolicy(){
  document.getElementById("policyModal").style.display="flex";
}
function closePolicy(){
  document.getElementById("policyModal").style.display="none";
}

displayShayari();

</script>

</body>
</html>
