<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shayari Premium Pro Max</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}

body{
  background: linear-gradient(135deg,#ffdde1,#ee9ca7);
  min-height:100vh;
}

/* HEADER */
.top-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:16px;
  color:#fff;
  background: linear-gradient(135deg,#ff758c,#ff7eb3);
  border-radius:0 0 20px 20px;
}

.top-actions button{
  border:none;
  padding:8px 12px;
  border-radius:10px;
  background:rgba(255,255,255,.3);
  color:#fff;
  margin-left:6px;
}

/* SEARCH */
.search-box{
  padding:12px;
}

.search-box input{
  width:100%;
  padding:12px;
  border-radius:12px;
  border:none;
  font-size:16px;
}

/* CATEGORY */
.tabs{
  display:flex;
  gap:8px;
  padding:10px;
  overflow:auto;
}

.tab{
  padding:8px 14px;
  background:#ffffff55;
  border-radius:20px;
  cursor:pointer;
  white-space:nowrap;
}

.tab.active{
  background:#ff758c;
  color:#fff;
}

/* CARD */
.container{padding:12px;}

.card{
  background:rgba(255,255,255,.7);
  backdrop-filter:blur(10px);
  padding:18px;
  border-radius:18px;
  margin-bottom:14px;
  box-shadow:0 10px 20px rgba(0,0,0,.1);
}

.shayari{
  font-size:18px;
  margin-bottom:12px;
}

/* BUTTONS */
.btn-row{display:flex;flex-wrap:wrap;gap:6px;}

.btn{
  border:none;
  padding:7px 12px;
  border-radius:10px;
  color:#fff;
  cursor:pointer;
}

.copy{background:#27ae60;}
.share{background:#3b82f6;}
.whatsapp{background:#25d366;}
.status{background:#f59e0b;}
.fav{background:#ff4d6d;}

.fav.active{
  animation:heart .4s;
}

@keyframes heart{
  0%{transform:scale(1);}
  50%{transform:scale(1.4);}
  100%{transform:scale(1);}
}

/* ADMOB PLACEHOLDER */
.adbox{
  margin:15px;
  padding:20px;
  text-align:center;
  background:#ffffff88;
  border-radius:12px;
  font-weight:bold;
}
</style>
</head>

<body>

<header class="top-header">
  <h2>Shayari Premium Pro ✨</h2>
  <div class="top-actions">
    <button onclick="showFavorites()">⭐</button>
    <button onclick="openPrivacy()">📜</button>
  </div>
</header>

<div class="search-box">
  <input type="text" id="search" placeholder="Search shayari...">
</div>

<div class="tabs">
  <div class="tab active" onclick="setCategory('All',this)">All</div>
  <div class="tab" onclick="setCategory('Love',this)">Love</div>
  <div class="tab" onclick="setCategory('Sad',this)">Sad</div>
  <div class="tab" onclick="setCategory('Friend',this)">Friend</div>
</div>

<div class="adbox">📢 AdMob Banner Here</div>

<div class="container" id="list"></div>

<script>
const data=[
{text:"Tere bina jeena mushkil hai ❤️",cat:"Love"},
{text:"Mohabbat ki duniya haseen hoti hai 💕",cat:"Love"},
{text:"Dil tootne ki awaaz nahi hoti 💔",cat:"Sad"},
{text:"Waqt sab kuch sikha deta hai 😢",cat:"Sad"},
{text:"Dosti sabse pyari hoti hai 🤝",cat:"Friend"}
];

let currentCat="All";
let favorites=JSON.parse(localStorage.getItem("fav")||"[]");

function render(){
  const q=document.getElementById("search").value.toLowerCase();
  const list=document.getElementById("list");
  list.innerHTML="";

  data
  .filter(s=>(currentCat==="All"||s.cat===currentCat))
  .filter(s=>s.text.toLowerCase().includes(q))
  .forEach(s=>{
    const isFav=favorites.includes(s.text);

    const card=document.createElement("div");
    card.className="card";
    card.innerHTML=`
      <div class="shayari">${s.text}</div>
      <div class="btn-row">
        <button class="btn copy">Copy</button>
        <button class="btn share">Share</button>
        <button class="btn whatsapp">WhatsApp</button>
        <button class="btn status">Status</button>
        <button class="btn fav ${isFav?'active':''}">❤️</button>
        <button class="btn" style="background:#8b5cf6">🖼</button>
      </div>
    `;

    // copy
    card.querySelector(".copy").onclick=()=>{
      navigator.clipboard.writeText(s.text);
      alert("Copied!");
    };

    // share
    card.querySelector(".share").onclick=()=>{
      navigator.share?.({text:s.text});
    };

    // WhatsApp
    card.querySelector(".whatsapp").onclick=()=>{
      window.open("https://wa.me/?text="+encodeURIComponent(s.text));
    };

    // fav save
    card.querySelector(".fav").onclick=(e)=>{
      const i=favorites.indexOf(s.text);
      if(i>-1) favorites.splice(i,1);
      else favorites.push(s.text);
      localStorage.setItem("fav",JSON.stringify(favorites));
      e.target.classList.toggle("active");
    };

    // image generator
    card.querySelectorAll(".btn")[5].onclick=()=>{
      generateImage(s.text);
    };

    list.appendChild(card);
  });
}

function setCategory(cat,el){
  currentCat=cat;
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
  el.classList.add("active");
  render();
}

document.getElementById("search").oninput=render;

function showFavorites(){
  alert("Favourite saved: "+favorites.length);
}

function openPrivacy(){
  alert("Add your privacy policy page.");
}

/* IMAGE GENERATOR */
function generateImage(text){
  const c=document.createElement("canvas");
  c.width=800;
  c.height=800;
  const ctx=c.getContext("2d");

  const g=ctx.createLinearGradient(0,0,800,800);
  g.addColorStop(0,"#ff758c");
  g.addColorStop(1,"#ff7eb3");
  ctx.fillStyle=g;
  ctx.fillRect(0,0,800,800);

  ctx.fillStyle="#fff";
  ctx.font="40px Arial";
  ctx.textAlign="center";

  wrapText(ctx,text,400,400,600,50);

  const url=c.toDataURL();
  const w=window.open();
  w.document.write('<img src="'+url+'" style="width:100%">');
}

function wrapText(ctx,text,x,y,maxWidth,lineHeight){
  const words=text.split(' ');
  let line='';
  let yy=y;
  for(let n=0;n<words.length;n++){
    const test=line+words[n]+' ';
    if(ctx.measureText(test).width>maxWidth){
      ctx.fillText(line,x,yy);
      line=words[n]+' ';
      yy+=lineHeight;
    }else line=test;
  }
  ctx.fillText(line,x,yy);
}

render();
</script>

</body>
</html>
