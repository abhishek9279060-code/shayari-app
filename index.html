<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shayari Premium Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<!-- AdMob Script -->
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXX"
     crossorigin="anonymous"></script>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:linear-gradient(135deg,#ff9ab5,#ffc3d4);
padding:15px;
transition:0.3s;
}

body.dark{
background:#121212;
color:white;
}

.header{
background:#ff4f81;
color:white;
padding:18px;
border-radius:18px;
text-align:center;
font-size:22px;
font-weight:600;
display:flex;
justify-content:space-between;
align-items:center;
}

.dark-toggle{
background:white;
border:none;
padding:5px 10px;
border-radius:15px;
cursor:pointer;
}

.search-box{
margin:15px 0;
}

.search-box input{
width:100%;
padding:12px;
border:none;
border-radius:12px;
outline:none;
}

.categories{
display:flex;
gap:10px;
margin-bottom:15px;
overflow-x:auto;
}

.categories button{
padding:8px 15px;
border:none;
border-radius:20px;
background:white;
cursor:pointer;
}

.categories button.active{
background:#ff4f81;
color:white;
}

.card{
background:white;
padding:20px;
border-radius:20px;
margin-bottom:15px;
box-shadow:0 8px 20px rgba(0,0,0,0.15);
}

body.dark .card{
background:#1e1e1e;
}

.actions{
display:flex;
flex-wrap:wrap;
gap:10px;
margin-top:10px;
}

.actions button{
flex:1;
padding:8px;
border:none;
border-radius:12px;
cursor:pointer;
color:white;
}

.copy{background:#4CAF50;}
.share{background:#2196F3;}
.status{background:#ff9800;}
.fav{background:#e91e63;}

.ad-box{
margin:15px 0;
text-align:center;
}

.footer{
text-align:center;
margin-top:20px;
font-size:13px;
}

.modal{
display:none;
position:fixed;
bottom:0;
left:0;
right:0;
background:white;
padding:20px;
border-radius:20px 20px 0 0;
box-shadow:0 -5px 20px rgba(0,0,0,0.2);
}

.modal button{
width:100%;
margin-top:10px;
padding:10px;
border:none;
border-radius:10px;
cursor:pointer;
}

</style>
</head>
<body>

<div class="header">
<span>✨ Shayari Premium Pro ✨</span>
<button class="dark-toggle" onclick="toggleDark()">🌙</button>
</div>

<div class="search-box">
<input type="text" id="search" placeholder="Search shayari...">
</div>

<div class="categories">
<button class="active" onclick="filterCategory('all', this)">All</button>
<button onclick="filterCategory('love', this)">Love</button>
<button onclick="filterCategory('sad', this)">Sad</button>
<button onclick="filterCategory('friend', this)">Friend</button>
<button onclick="showFavorites(this)">Favorites</button>
</div>

<!-- AdMob Banner -->
<div class="ad-box">
<ins class="adsbygoogle"
     style="display:block"
     data-ad-client="ca-pub-XXXXXXXX"
     data-ad-slot="1234567890"
     data-ad-format="auto"
     data-full-width-responsive="true"></ins>
<script>
     (adsbygoogle = window.adsbygoogle || []).push({});
</script>
</div>

<div id="shayari-container"></div>

<div class="footer">
<a href="#" onclick="showPrivacy()">Privacy Policy</a><br>
Made with ❤️ by Abhishek
</div>

<!-- Share Modal -->
<div class="modal" id="shareModal">
<h3>Share Options</h3>
<button onclick="copyText()">Copy</button>
<button onclick="statusText()">Post as Status</button>
<button onclick="closeModal()">Close</button>
</div>

<script>

const shayariData = [
{ text:"Tere bina jeena mushkil hai ❤️", category:"love"},
{ text:"Mohabbat ki duniya haseen hoti hai 💕", category:"love"},
{ text:"Dil tootne ki awaaz nahi hoti 💔", category:"sad"},
{ text:"Dost zindagi ka sabse bada sahara hai 🤝", category:"friend"}
];

let currentShareText = "";
let favorites = JSON.parse(localStorage.getItem("favorites")) || [];

const container = document.getElementById("shayari-container");

function displayShayari(data){
container.innerHTML="";
data.forEach(item=>{
const card=document.createElement("div");
card.className="card";
card.innerHTML=`
<p>${item.text}</p>
<div class="actions">
<button class="copy" onclick="copyDirect('${item.text}')">Copy</button>
<button class="share" onclick="openShare('${item.text}')">Share</button>
<button class="status" onclick="statusDirect('${item.text}')">Status</button>
<button class="fav" onclick="addFavorite('${item.text}')">❤️</button>
</div>
`;
container.appendChild(card);
});
}

function filterCategory(category,btn){
document.querySelectorAll(".categories button").forEach(b=>b.classList.remove("active"));
btn.classList.add("active");

if(category==="all"){
displayShayari(shayariData);
}else{
displayShayari(shayariData.filter(item=>item.category===category));
}
}

function toggleDark(){
document.body.classList.toggle("dark");
}

function openShare(text){
currentShareText=text;
document.getElementById("shareModal").style.display="block";
}

function closeModal(){
document.getElementById("shareModal").style.display="none";
}

function copyText(){
navigator.clipboard.writeText(currentShareText);
alert("Copied!");
}

function copyDirect(text){
navigator.clipboard.writeText(text);
alert("Copied!");
}

function statusText(){
alert("Status Ready: Copy and paste in WhatsApp 😉");
}

function statusDirect(text){
alert("Copy & paste in WhatsApp status 😉");
}

function addFavorite(text){
if(!favorites.includes(text)){
favorites.push(text);
localStorage.setItem("favorites",JSON.stringify(favorites));
alert("Added to Favorites ❤️");
}
}

function showFavorites(btn){
document.querySelectorAll(".categories button").forEach(b=>b.classList.remove("active"));
btn.classList.add("active");
displayShayari(favorites.map(text=>({text:text,category:"fav"})));
}

document.getElementById("search").addEventListener("input",function(){
const value=this.value.toLowerCase();
displayShayari(shayariData.filter(item=>item.text.toLowerCase().includes(value)));
});

function showPrivacy(){
alert("Privacy Policy: We do not collect personal data. Ads may use cookies.");
}

displayShayari(shayariData);

</script>

</body>
